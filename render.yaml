services:
  - type: worker
    name: apteka-ai-bot
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
