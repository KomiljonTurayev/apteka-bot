services:
  - type: worker
    name: apteka-ai-bot
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: apteka-postgres-db
          property: connectionString

databases:
  - name: apteka-postgres-db
    databaseName: pharmacy_db
    user: postgres
    region: singapore
